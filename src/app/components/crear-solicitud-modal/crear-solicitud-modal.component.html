<mat-card>
  <mat-card-header>
    <mat-card-title>
      Crear solicitud
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field appearance="outline">
        <mat-label>
          Estudiante
        </mat-label>
        <mat-select
          formControlName="estudianteId">
          @for(estudiante of estudiantes;
            track estudiante.id) {
            <mat-option
              [value]="estudiante.id">
              {{ estudiante.numeroDocumento }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>
          Tipo de apoyo
        </mat-label>
        <mat-select formControlName="tipoApoyo">
          <mat-option [value]="TipoApoyo.Beca">
            Beca
          </mat-option>
          <mat-option [value]="TipoApoyo.Credito">
            Crédito
          </mat-option>
          <mat-option [value]="TipoApoyo.Subsidio">
            Subsidio
          </mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>
          Monto solicitado
        </mat-label>
        <input matInput formControlName="montoSolicitado">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>
          Descripción
        </mat-label>
        <textarea matInput rows="4" formControlName="descripcion">
        </textarea>
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="cancel()" [disabled]="loading()">
      Cancelar
    </button>
    <button mat-raised-button color="primary" (click)="create()" [disabled]="loading()">
      Crear solicitud
    </button>
    @if (loading()) {
      <mat-spinner diameter="25"></mat-spinner>
    }
  </mat-card-actions>
</mat-card>
