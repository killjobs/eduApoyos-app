<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm">
        <mat-form-field appearance="outline">
          <mat-label>Correo electrónico</mat-label>
          <input matInput type="correoElectronico" formControlName="correoElectronico">
          @if (correoElectronico.hasError('required')) {
            <mat-error>
              El correo es obligatorio
            </mat-error>
          }
          @if (correoElectronico.hasError('pattern')) {
            <mat-error>
              Correo inválido
            </mat-error>
          }
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password">
          @if (password.hasError('required')) {
            <mat-error>
              La contraseña es obligatoria
            </mat-error>
          }
        </mat-form-field>
        <button mat-raised-button color="primary" class="full-width" (click)="login()" [disabled]="loading()">
          @if (!loading()) {
            <span>Iniciar sesión</span>
          }
          @if (loading()) {
            <mat-spinner diameter="20">
            </mat-spinner>
          }
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <a class="register-link" routerLink="/register">
        ¿No tienes cuenta? Regístrate
      </a>
    </mat-card-actions>
  </mat-card>
</div>
